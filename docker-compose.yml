services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: sigtram3-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        env_file:
            - .env
        networks:
            - sigtram3-network
        depends_on:
            - redis

    web:
        image: nginx:alpine
        container_name: sigtram3-web
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - sigtram3-network
        depends_on:
            - app

    redis:
        image: redis:alpine
        container_name: sigtram3-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        networks:
            - sigtram3-network

networks:
    sigtram3-network:
        driver: bridge

volumes:
    redis-data:
        driver: local
